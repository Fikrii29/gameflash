<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Dashboard - Gameflash</title>
<link rel="stylesheet" href="css/style.css?v=4"/>
<link rel="stylesheet" href="css/home.css?v=4"/>
<link rel="stylesheet" href="css/auth.css?v=4"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
</head>
<body class="home">
<div class="bg-particles"></div>
<nav class="navbar">
  <a href="index.html" class="nav-brand"><div class="logo-icon">⚡</div><span>Gameflash</span></a>
  <div class="bj-actions">
    <a class="bj-circle" id="navUserBtn" href="login.html" aria-label="Akun">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6"/></svg>
    </a>
    <button class="bj-circle" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="nav-links" id="navLinks">
    <a href="index.html" class="nav-link">Beranda</a>
    <a href="check-order.html" class="nav-link">Cek Pesanan</a>
    <a href="tentang-kami.html" class="nav-link">Tentang Kami</a>
    <a href="check-order.html" class="nav-cta">🔍 Cek Status</a>
  </div>
</nav>

<main class="dash-wrap">
  <div class="dash-card">
    <div class="dash-head">
      <div class="dash-avatar" id="dAvatar">G</div>
      <div>
        <div class="dash-name" id="dName">-</div>
        <div class="dash-phone" id="dPhone">-</div>
        <span class="role-badge" id="dRole">-</span>
      </div>
    </div>

    <div class="dash-stats">
      <div class="dash-stat"><span>Total Belanja</span><b id="dSpent">Rp0</b></div>
      <div class="dash-stat"><span>Transaksi Berhasil</span><b id="dTx">0</b></div>
    </div>

    <div class="prog">
      <div class="prog-bar"><i id="dBar" style="width:0%"></i></div>
      <div class="prog-txt" id="dProgTxt"></div>
    </div>

    <div class="dash-sec">
      <h3>Riwayat Transaksi</h3>
      <div id="dList"></div>
    </div>

    <div class="dash-sec" id="editSec" style="display:none">
      <h3>Ubah Nama</h3>
      <div class="auth-field"><input id="dNewName" type="text" maxlength="30" placeholder="Nama baru"/></div>
      <button class="auth-btn" id="btnSaveName" type="button">Simpan Nama</button>
    </div>

    <div class="dash-actions">
      <a href="index.html">🎮 Top Up</a>
      <button type="button" id="btnEdit">✏️ Ubah Nama</button>
      <button type="button" class="danger" id="btnLogout">🚪 Keluar</button>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>
<script src="js/storage.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/footer.js?v=4"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (!Auth.isLoggedIn()) { location.replace('login.html?next=dashboard.html'); return; }

  function rp(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  var STATUS = { success: 'Berhasil', pending: 'Menunggu', processing: 'Diproses', failed: 'Gagal', expired: 'Kedaluwarsa', cancelled: 'Dibatalkan' };

  function render() {
    var u = Auth.refreshUserStats(Auth.getUser().phone) || Auth.getUser();
    var role = Auth.getRoleInfo(u.role);
    $('dAvatar').textContent = u.avatar || 'G';
    $('dAvatar').style.background = role.gradient;
    $('dName').textContent = u.name;
    $('dPhone').textContent = '+' + u.phone;
    $('dRole').textContent = role.emoji + ' ' + role.name;
    $('dRole').style.background = role.gradient;
    $('dSpent').textContent = rp(u.totalSpent);
    $('dTx').textContent = u.totalTransactions || 0;

    // progres menuju role berikutnya
    var next = u.role === 'bronze' ? 'silver' : (u.role === 'silver' ? 'gold' : null);
    if (next) {
      var n = Auth.ROLES[next], cur = Auth.ROLES[u.role];
      var pct = Math.min(100, Math.round(((u.totalSpent - cur.min) / (n.min - cur.min)) * 100));
      $('dBar').style.width = Math.max(pct, 3) + '%';
      $('dProgTxt').textContent = 'Belanja ' + rp(n.min - u.totalSpent) + ' lagi untuk naik ke ' + n.emoji + ' ' + n.name + '.';
    } else {
      $('dBar').style.width = '100%';
      $('dProgTxt').textContent = 'Kamu sudah di role tertinggi. Terima kasih sudah jadi member setia! 🎉';
    }

    // riwayat transaksi milik nomor ini
    var txs = (GF.get(GF.KEYS.TRANSACTIONS) || []).filter(function (t) { return Auth.normalizePhone(t.customerPhone) === u.phone; });
    txs.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    txs = txs.slice(0, 10);
    $('dList').innerHTML = txs.length ? txs.map(function (t) {
      var d = t.createdAt ? new Date(t.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      var st = t.status || 'pending';
      return '<a class="tx" href="check-order.html?invoice=' + encodeURIComponent(t.invoiceId) + '">' +
        '<div class="tx-main"><b>' + esc(t.gameName) + ' – ' + esc(t.packageName) + '</b><span>' + esc(t.invoiceId) + ' • ' + d + '</span></div>' +
        '<div class="tx-right"><b>' + rp(t.finalAmount) + '</b><span class="st ' + esc(st) + '">' + esc(STATUS[st] || st) + '</span></div></a>';
    }).join('') : '<div class="empty">Belum ada transaksi dengan nomor ini.</div>';
  }

  $('btnLogout').onclick = function () { Auth.logout(); };
  $('btnEdit').onclick = function () { var s = $('editSec'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; $('dNewName').value = Auth.getUser().name; };
  $('btnSaveName').onclick = function () { if (Auth.updateName($('dNewName').value)) { $('editSec').style.display = 'none'; render(); Auth.initNav(); } };
  render();
})();
</script>
</body>
</html>
