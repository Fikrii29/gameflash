<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cek Pesanan - Gameflash</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
<style>
  .check-page { padding-top: 70px; min-height: 100vh; }
  .check-container { max-width: 680px; margin: 0 auto; padding: 60px 24px; }
  .check-form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; margin-bottom: 32px; }
  .search-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab-btn { flex: 1; padding: 10px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 0.875rem; font-weight: 500; transition: var(--transition); }
  .tab-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,212,255,0.08); }
  .result-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .result-header { padding: 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  .status-icon-big { font-size: 2.5rem; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
  .result-title { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; }
  .result-invoice { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .result-body { padding: 28px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .result-item .key { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .result-item .val { font-size: 0.95rem; font-weight: 500; }
  .result-timeline { padding: 0 28px 28px; }
  .timeline-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px; }
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .timeline-item { display: flex; gap: 16px; position: relative; }
  .timeline-item:not(:last-child)::before { content:''; position:absolute; left:15px; top:32px; bottom:-16px; width:2px; background:var(--border); }
  .timeline-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; margin-bottom: 16px; }
  .timeline-dot.active { background: rgba(0,212,255,0.15); border: 2px solid var(--cyan); }
  .timeline-dot.done { background: var(--green); border: 2px solid var(--green); }
  .timeline-dot.pending { background: rgba(255,255,255,0.05); border: 2px solid var(--border); }
  .timeline-dot.failed { background: rgba(239,68,68,0.15); border: 2px solid var(--red); }
  .timeline-content { flex: 1; padding-bottom: 16px; }
  .timeline-step-title { font-size: 0.9rem; font-weight: 600; }
  .timeline-step-time { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .recent-list { display: flex; flex-direction: column; gap: 12px; }
  .recent-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: var(--transition); }
  .recent-item:hover { border-color: var(--border-glow); }
  .recent-emoji { font-size: 1.8rem; }
  .recent-info { flex: 1; }
  .recent-name { font-size: 0.9rem; font-weight: 600; }
  .recent-inv { font-size: 0.75rem; color: var(--text-muted); }
  .recent-right { text-align: right; }
  .recent-amount { font-size: 0.9rem; font-weight: 600; color: var(--cyan); }
  .recent-date { font-size: 0.72rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="bg-particles" id="bgParticles"></div>
<div class="toast-container" id="toastContainer"></div>

<nav class="navbar">
  <a href="index.html" class="nav-brand"><div class="logo-icon">⚡</div><span>Gameflash</span></a>
  <div class="nav-links" id="navLinks">
    <a href="index.html" class="nav-link">Beranda</a>
    <a href="check-order.html" class="nav-link active">Cek Pesanan</a>
    <a href="check-order.html" class="nav-cta">🔍 Cek Status</a>
  </div>
  <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')"><span></span><span></span><span></span></div>
</nav>

<div class="check-page">
  <div class="check-container">
    <div style="text-align:center;margin-bottom:40px;">
      <div class="section-badge" style="display:inline-block;margin-bottom:12px;">🔍 Lacak Pesanan</div>
      <h1 style="font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:700;margin-bottom:8px;">Cek Status <span style="background:var(--gradient-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Pesanan</span></h1>
      <p style="color:var(--text-secondary);">Pantau status top up kamu tanpa perlu login</p>
    </div>

    <div class="check-form-card">
      <div class="search-tabs">
        <button class="tab-btn active" id="tab1" onclick="switchTab('invoice')">📋 Invoice ID</button>
        <button class="tab-btn" id="tab2" onclick="switchTab('phone')">📱 Nomor WA</button>
      </div>

      <div id="invoiceForm">
        <div class="form-group">
          <label class="form-label">Nomor Invoice</label>
          <input type="text" class="form-control" id="invoiceInput" placeholder="Contoh: GFM3XY12AB" style="text-transform:uppercase;font-size:1rem;letter-spacing:1px;" oninput="this.value=this.value.toUpperCase()"/>
        </div>
        <button class="btn-primary" style="width:100%;padding:14px;" onclick="searchByInvoice()">
          🔍 Cari Pesanan
        </button>
      </div>

      <div id="phoneForm" style="display:none;">
        <div class="form-group">
          <label class="form-label">Nomor WhatsApp</label>
          <input type="tel" class="form-control" id="phoneInput" placeholder="Contoh: 081234567890"/>
        </div>
        <button class="btn-primary" style="width:100%;padding:14px;" onclick="searchByPhone()">
          🔍 Cari Riwayat Pesanan
        </button>
      </div>
    </div>

    <!-- Search Result -->
    <div id="resultContainer"></div>

    <!-- Recent Transactions -->
    <div id="recentContainer"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script>
let activeTab = 'invoice';

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('invoiceForm').style.display = tab === 'invoice' ? 'block' : 'none';
  document.getElementById('phoneForm').style.display = tab === 'phone' ? 'block' : 'none';
  document.getElementById('tab1').classList.toggle('active', tab === 'invoice');
  document.getElementById('tab2').classList.toggle('active', tab === 'phone');
  document.getElementById('resultContainer').innerHTML = '';
}

function searchByInvoice() {
  const inv = document.getElementById('invoiceInput').value.trim().toUpperCase();
  if (!inv) { showToast('Masukkan nomor invoice', 'error'); return; }
  const txs = GF.get(GF.KEYS.TRANSACTIONS) || [];
  const tx = txs.find(t => t.invoiceId === inv || t.id === inv);
  renderResult(tx ? [tx] : []);
}

function searchByPhone() {
  const phone = document.getElementById('phoneInput').value.trim().replace(/^0/, '62').replace(/\D/g,'');
  if (!phone) { showToast('Masukkan nomor WhatsApp', 'error'); return; }
  const txs = GF.get(GF.KEYS.TRANSACTIONS) || [];
  const results = txs.filter(t => t.customerPhone.replace(/\D/g,'').endsWith(phone.slice(-9)));
  renderResult(results);
}

function renderResult(txs) {
  const container = document.getElementById('resultContainer');
  if (!txs || txs.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:48px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);">
      <div style="font-size:3rem;margin-bottom:16px;">😕</div>
      <h3 style="font-family:'Rajdhani',sans-serif;margin-bottom:8px;">Pesanan Tidak Ditemukan</h3>
      <p style="color:var(--text-muted);font-size:0.875rem;">Pastikan nomor invoice atau nomor WA yang kamu masukkan benar</p>
    </div>`;
    return;
  }

  if (txs.length === 1) {
    container.innerHTML = renderSingleTransaction(txs[0]);
  } else {
    container.innerHTML = `
      <h3 style="font-family:'Rajdhani',sans-serif;margin-bottom:16px;">📋 Riwayat Transaksi (${txs.length})</h3>
      <div class="recent-list">
        ${txs.map(tx => renderRecentItem(tx)).join('')}
      </div>`;
  }
}

function renderSingleTransaction(tx) {
  const statusMap = {
    pending: { icon:'⏳', label:'Menunggu Pembayaran', color:'var(--yellow)', bg:'rgba(245,158,11,0.1)' },
    processing: { icon:'⚙️', label:'Sedang Diproses', color:'var(--cyan)', bg:'rgba(0,212,255,0.1)' },
    retrying: { icon:'🔄', label:'Mencoba Ulang...', color:'var(--yellow)', bg:'rgba(245,158,11,0.1)' },
    success: { icon:'✅', label:'Berhasil', color:'var(--green)', bg:'rgba(16,185,129,0.1)' },
    failed: { icon:'❌', label:'Gagal', color:'var(--red)', bg:'rgba(239,68,68,0.1)' },
  };
  const s = statusMap[tx.status] || statusMap.pending;
  
  const steps = [
    { key:'created', label:'Pesanan Dibuat', icon:'📋', desc:'Order berhasil dibuat' },
    { key:'paid', label:'Pembayaran Dikonfirmasi', icon:'💳', desc:'Pembayaran diterima' },
    { key:'processing', label:'Diproses', icon:'⚙️', desc:'Item sedang dikirim ke akun' },
    { key:'done', label:'Selesai', icon:'✅', desc:'Top up berhasil masuk' },
  ];
  
  const statusOrder = ['pending','processing','success','failed'];
  const currentIdx = statusOrder.indexOf(tx.status);
  
  const timelineHtml = steps.map((step, i) => {
    let cls = 'pending';
    if (tx.status === 'failed' && i >= 2) { cls = 'failed'; }
    else if (i === 0) cls = 'done';
    else if (tx.status === 'success' && i <= 3) cls = 'done';
    else if (tx.status === 'processing' && i <= 2) cls = i === 2 ? 'active' : 'done';
    else if (tx.status === 'pending' && i === 0) cls = 'done';
    
    const emoji = cls === 'done' ? '✓' : cls === 'active' ? step.icon : cls === 'failed' ? '✗' : step.icon;
    return `<div class="timeline-item">
      <div class="timeline-dot ${cls}">${emoji}</div>
      <div class="timeline-content">
        <div class="timeline-step-title">${step.label}</div>
        <div class="timeline-step-time">${cls === 'done' ? formatDate(tx.updatedAt) : cls === 'active' ? 'Sedang berlangsung...' : 'Menunggu'}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="result-card">
    <div class="result-header">
      <div class="status-icon-big" style="background:${s.bg};color:${s.color}">${s.icon}</div>
      <div>
        <div style="color:${s.color};font-weight:600;font-size:0.85rem;margin-bottom:4px;">${s.label}</div>
        <div class="result-title">${tx.gameName} - ${tx.packageName}</div>
        <div class="result-invoice">Invoice: ${tx.invoiceId}</div>
      </div>
    </div>
    <div class="result-body">
      <div class="result-grid">
        <div class="result-item"><div class="key">Game</div><div class="val">${tx.gameEmoji||'🎮'} ${tx.gameName}</div></div>
        <div class="result-item"><div class="key">Paket</div><div class="val">${tx.packageName}</div></div>
        <div class="result-item"><div class="key">User ID</div><div class="val">${tx.userId}${tx.zoneId?' | Server: '+tx.zoneId:''}</div></div>
        <div class="result-item"><div class="key">Metode Bayar</div><div class="val">${tx.paymentMethod}${tx.paymentGateway ? ' <span style="font-size:0.65rem;color:var(--text-muted);">('+tx.paymentGateway+')</span>' : ''}</div></div>
        ${tx.voucherCode ? `<div class="result-item"><div class="key">Voucher</div><div class="val" style="color:var(--green)">${tx.voucherCode} (-${formatRupiah(tx.discount)})</div></div>` : ''}
        <div class="result-item"><div class="key">Total Bayar</div><div class="val" style="color:var(--cyan);font-size:1.1rem;">${formatRupiah(tx.finalAmount)}</div></div>
        <div class="result-item"><div class="key">Tanggal Order</div><div class="val">${formatDate(tx.createdAt)}</div></div>
        <div class="result-item"><div class="key">Update Terakhir</div><div class="val">${formatDate(tx.updatedAt)}</div></div>
        ${tx.retryCount ? `<div class="result-item"><div class="key">Retry</div><div class="val" style="color:var(--yellow)">🔄 ${tx.retryCount}x percobaan</div></div>` : ''}
        ${tx.failReason ? `<div class="result-item"><div class="key">Alasan Gagal</div><div class="val" style="color:var(--red)">${tx.failReason}</div></div>` : ''}
        ${tx.refundStatus === 'pending' ? `<div class="result-item" style="grid-column:1/-1"><div class="key">💰 Status Refund</div><div class="val" style="color:var(--yellow)">⏳ Refund sedang diproses (1x24 jam)</div></div>` : ''}
      </div>
    </div>
    <div class="result-timeline">
      <div class="timeline-title">📊 Progress Transaksi</div>
      <div class="timeline">${timelineHtml}</div>
    </div>
  </div>`;
}

function renderRecentItem(tx) {
  const statusMap = {
    pending:'⏳', processing:'⚙️', success:'✅', failed:'❌'
  };
  const badges = {
    pending:'badge-warning', processing:'badge-info', success:'badge-success', failed:'badge-danger'
  };
  return `<div class="recent-item" onclick="showTransaction('${tx.invoiceId}')">
    <div class="recent-emoji">${tx.gameEmoji||'🎮'}</div>
    <div class="recent-info">
      <div class="recent-name">${tx.gameName} - ${tx.packageName}</div>
      <div class="recent-inv">${tx.invoiceId}</div>
    </div>
    <div class="recent-right">
      <div class="recent-amount">${formatRupiah(tx.finalAmount)}</div>
      <div style="margin-top:4px;"><span class="badge ${badges[tx.status]}">${statusMap[tx.status]} ${tx.status}</span></div>
      <div class="recent-date">${formatDate(tx.createdAt)}</div>
    </div>
  </div>`;
}

function showTransaction(invoiceId) {
  const txs = GF.get(GF.KEYS.TRANSACTIONS) || [];
  const tx = txs.find(t => t.invoiceId === invoiceId);
  if (tx) document.getElementById('resultContainer').innerHTML = renderSingleTransaction(tx);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  t.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(t); setTimeout(() => t.remove(), 3200);
}

function createParticles() {
  const c = document.getElementById('bgParticles'); if(!c) return;
  for (let i=0;i<10;i++) {
    const p=document.createElement('div'); p.className='particle';
    const s=Math.random()*3+1;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${['#00d4ff','#8b5cf6'][i%2]};animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s;`;
    c.appendChild(p);
  }
}

function init() {
  createParticles();
  const params = new URLSearchParams(window.location.search);
  const inv = params.get('invoice');
  if (inv) {
    document.getElementById('invoiceInput').value = inv;
    searchByInvoice();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
<!-- FLOATING WHATSAPP CS -->
<div class="floating-wa" id="floatingWa">
  <div class="wa-tooltip">💬 Butuh bantuan? Chat kami!</div>
  <button class="wa-btn" onclick="(function(){ const s=GF.get(GF.KEYS.SETTINGS)||{}; window.open('https://wa.me/'+(s.whatsapp||'6281234567890')+'?text='+encodeURIComponent('Halo, saya ingin bertanya tentang pesanan saya di Gameflash'),'_blank'); })()">
    💬
  </button>
</div>
</body>
</html>
